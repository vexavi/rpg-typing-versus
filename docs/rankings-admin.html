<!doctype html><html lang="en"><head><script>document.documentElement.dataset.v66Teacher="required";</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Assignments — RPG Typing Versus</title>
<style>body{font:15px system-ui,sans-serif;background:#ebedf0;color:#202c38;margin:0}main{max-width:950px;margin:30px auto;padding:18px;background:white;border:1px solid #cbd2db;border-radius:10px}table{border-collapse:collapse;width:100%}td,th{padding:12px 10px;text-align:left;border-bottom:1px solid #ddd}select,button{font:inherit;padding:8px}button{cursor:pointer}p{line-height:1.5}#notice{min-height:22px}small{color:#596579}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input{min-height:40px;padding:8px 10px;font:inherit;flex:1;min-width:180px;border:1px solid #bbc3ca}.toolbar button{border:1px solid #bbc3ca;background:#fff;min-height:40px}.saving{opacity:.5}</style>
<link rel="stylesheet" href="teacher-nav.css?v=133.0"><script defer src="teacher-nav.js?v=133.0"></script>
</head><body><div id="v66Startup" style="position:fixed;inset:0;z-index:2147483646;background:#111225;color:#ffecc0;display:grid;place-items:center;padding:20px;font:800 18px system-ui;text-align:center"><div>CONNECTING TO FIREBASE…<p style="font:400 14px system-ui;color:#e3def3">Internet connection required to play. If this screen stays here, check your connection and reload.</p></div></div><main><h1>Class Assignments</h1><p>Changing grade clears that player’s rankings.</p><div class="toolbar"><input id="cardFilter" type="search" placeholder="Search student or Player ID" aria-label="Find student"><button type="button" id="reload">Refresh</button></div><p id="notice" role="status">Loading...</p><table><thead><tr><th>Player ID</th><th>Student</th><th>Grade</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></main><script type="module">
await import("./online-spark.js?v=148.4");
const rows=document.getElementById('rows'),notice=document.getElementById('notice');
async function api(path,data={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||'Request failed');return j;}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let cards=[];document.getElementById('cardFilter').value=new URLSearchParams(location.search).get('player')||'';
function renderCards(){
 const filter=document.getElementById('cardFilter').value.trim().toLocaleLowerCase();
 const found=cards.filter(c=>!filter||String(c.public_id).toLowerCase().includes(filter)||String(c.username||'').toLocaleLowerCase().includes(filter));
 rows.innerHTML=found.map(c=>`<tr><td>${esc(c.public_id)}</td><td>${esc(c.username||'Unregistered')}</td><td><select aria-label="Grade for ${esc(c.username||c.public_id)}" data-id="${c.id}" ${c.disabled?'disabled':''}><option value="" ${!c.class_year?'selected':''}>Unassigned</option>${['1','2','3','1b','2b','3b'].map(g=>`<option value="${g}" ${c.class_year===g[0]&&((c.class_section==='b')===g.endsWith('b'))?'selected':''}>${g.endsWith('b')?g.toUpperCase():g+'年生'}</option>`).join('')}</select></td><td>${c.disabled?'Disabled':c.registered?'Registered':'Blank'}</td></tr>`).join('')||'<tr><td colspan="4">No matching cards.</td></tr>';
 notice.textContent=`Showing ${found.length} of ${cards.length} cards`;
}
async function load(){try{const r=await api('/api/cards/list');cards=r.cards;renderCards();}catch(e){notice.textContent=e.message||String(e);}}
document.getElementById('cardFilter').addEventListener('input',renderCards);
document.getElementById('reload').addEventListener('click',()=>void load());
rows.addEventListener('change',async e=>{
 const s=e.target.closest('select[data-id]');if(!s)return;
 s.disabled=true;s.classList.add('saving');notice.textContent='Saving grade…';
 try{
  const result=await api('/api/cards/set-class',{id:Number(s.dataset.id),class:s.value||null});
  const card=cards.find(c=>c.id===Number(s.dataset.id));
  if(card){card.class_year=s.value?s.value[0]:null;card.class_section=s.value.endsWith('b')?'b':'a';}
  notice.textContent=result.unchanged?'Grade unchanged.':'Grade saved. Previous rankings cleared.';
 }catch(err){const message=err.message||String(err);await load();notice.textContent=message;}
 finally{s.disabled=false;s.classList.remove('saving');}
});
// Wait for the online connection monitor, Firebase Auth, and setup checks to finish.
// Without this, the first Firestore request races the Firebase startup handshake.
async function bootClassAssignments(){
  try{
    notice.textContent='Connecting to Firebase…';
    const ready=await window.RPG_V66.ready;
    if(!ready){
      notice.textContent='Firebase connection unavailable. Check your teacher sign-in and reload.';
      return;
    }
    await load();
  }catch(e){notice.textContent=e?.message||String(e);}
}
void bootClassAssignments();</script></body></html>
