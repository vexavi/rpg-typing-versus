<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operator Art Roster — Preview Only</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0c0e16;color:#f4f4f4;font:15px system-ui,Arial,sans-serif}
    .wrap{max-width:1420px;margin:0 auto;padding:25px}
    header{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:10px;border-bottom:2px solid #bd2944;padding-bottom:15px;margin-bottom:18px}
    header strong{letter-spacing:.18em}
    h1{margin:7px 0;font-size:clamp(23px,3vw,40px)}
    p{color:#ccc}a{color:#fbd373}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
    .card{background:linear-gradient(155deg,#292d3d,#11121b);border:1px solid #ffffff35;box-shadow:inset 0 4px 0 var(--rarity);border-radius:7px;overflow:hidden;min-width:0}
    .portrait{height:280px;display:grid;place-items:center;background:radial-gradient(circle at center,#ffffff18,transparent 65%);position:relative}
    .portrait>img{max-height:100%;max-width:100%;object-fit:contain}
    .portrait .face{width:46px;height:46px;position:absolute;right:10px;bottom:10px;object-fit:cover;background:#171824;border:2px solid var(--rarity);border-radius:4px}
    .caption{display:flex;align-items:center;justify-content:space-between;padding:12px;gap:8px}
    .name{font-size:18px;font-weight:900}.stars{color:var(--rarity);white-space:nowrap;letter-spacing:-.08em;font-weight:800}
    .featured{font-size:10px;background:#f1c261;color:#292320;border-radius:3px;padding:4px 7px;font-weight:900;margin:0 10px 10px;display:inline-block}
    .note{font-size:12px;color:#b9bbce}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div><strong>RPG TYPING VERSUS</strong><h1>OPERATOR ROSTER</h1><p id="rosterSummary">Loading operator artwork…</p></div>
      <nav><a href="recruitment-reveal-demo.html">Reveal demo</a> · <a href="auras-demo.html">Aura demo</a></nav>
    </header>
    <section class="grid" id="rosterGrid" aria-label="Operator roster"></section>
    <p class="note">The roster preview works without Firebase. Real recruitment pulls, character ownership, and Guild Coin spending are not activated.</p>
  </div>
  <script src="gacha-catalog.js?v=106.0"></script>
  <script>
  (() => {
    'use strict';
    const catalog=window.RPG_GACHA_CATALOG;
    const characters=Array.isArray(catalog?.characters)?catalog.characters.filter(c=>/^[a-z][a-z0-9_]{0,39}$/.test(c.id)&&[4,5,6].includes(c.rarity)&&/^assets\/recruitment\/[a-z0-9_-]+\.webp$/.test(c.art||'')):[];
    const featured=catalog?.featured_character_id||'';
    document.getElementById('rosterSummary').textContent=`${characters.length} transparent artworks imported · featured 6★: ${characters.find(c=>c.id===featured)?.name||'none'} · preview only`;
    const grid=document.getElementById('rosterGrid');
    for(const character of characters){
      const card=document.createElement('article');card.className='card';
      card.style.setProperty('--rarity',character.rarity===6?'#ff9888':character.rarity===5?'#f6d274':'#c5a6ff');
      const portrait=document.createElement('div');portrait.className='portrait';
      const art=document.createElement('img');art.src=character.art;art.alt=character.name;art.loading='lazy';
      const face=document.createElement('img');face.src=`assets/profile-icons/${character.id}.webp`;face.className='face';face.alt='';face.loading='lazy';
      face.onerror=()=>face.remove();
      portrait.append(art,face);
      const caption=document.createElement('div');caption.className='caption';
      const name=document.createElement('span');name.className='name';name.textContent=character.name;
      const stars=document.createElement('span');stars.className='stars';stars.textContent='★'.repeat(character.rarity);
      caption.append(name,stars);card.append(portrait,caption);
      if(character.rarity===6&&character.id===featured){
        const tag=document.createElement('span');tag.className='featured';tag.textContent='CURRENTLY FEATURED';card.append(tag);
      }
      grid.append(card);
    }
  })();
  </script>
</body>
</html>
