<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Player Progress</title><link rel="stylesheet" href="teacher-nav.css?v=148.9"><script defer src="teacher-nav.js?v=149.0"></script><style>body{margin:0;background:#eef1f6;color:#1a293c;font:15px system-ui}main{max-width:850px;margin:auto;padding:20px}h1{margin:0 0 16px;font-size:26px}section{padding:16px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:12px}button,input{font:inherit;padding:9px;border:1px solid #c4ccd9;border-radius:6px}button{cursor:pointer;background:white}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}dt{font-size:12px;color:#56667b}dd{font-size:22px;font-weight:700;margin:0}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #ddd;padding:8px}#status{min-height:20px}[hidden]{display:none!important}</style><style>.pm-head{display:flex;align-items:center;justify-content:space-between;gap:12px}</style></head><body><main><div class="pm-head"><h1>Player Progress</h1><button id="logout" hidden>Sign out</button></div><section><div class="row"><button id="login">Sign in with Google</button><form id="lookup" class="row"><label for="player">Student</label><input id="player" list="players" required placeholder="Type a name or Player ID" autocomplete="off"><datalist id="players"></datalist><button id="load" disabled>Show progress</button></form></div><p id="status" role="status">Sign in.</p></section><section id="result" hidden><h2 id="name"></h2><dl id="stats"></dl><h3>Territory progress</h3><table><thead><tr><th>Territory</th><th>Stages cleared</th></tr></thead><tbody id="territories"></tbody></table><p id="legacy"></p><div class="row" id="actions"></div></section></main><script type="module" src="player-management.js?v=148.9"></script></body></html>
