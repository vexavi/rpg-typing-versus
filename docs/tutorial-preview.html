<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>RPG Typing Versus · Tutorial Demo (No Firebase)</title>
<link rel="stylesheet" href="recruitment-reveal.css?v=83"><style>
:root{--yellow:#e8da22;--ink:#f3f4f7;--dark:#12151c}*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#f1f3f4;color:#111;font:16px Arial,Helvetica,sans-serif}

.hint{color:#c3c9d0;font-size:15px;margin:7px 0 16px}.arena{position:relative;display:grid;grid-template-columns:1.1fr .9fr;min-height:360px;background:linear-gradient(135deg,#202c41,#10151c);border:1px solid #60718a4d;overflow:hidden}

#status{min-height:18px;color:#e8da22;font-weight:700}#loading{position:fixed;inset:0;z-index:1200;background:#131827;display:grid;place-items:center;color:#fff;text-align:center;padding:30px}#loading[hidden]{display:none}

<script>
 sessionStorage.setItem('rpgAdventureContext',JSON.stringify({card_code:'ABCDEFGHJKLMNPQR',name:'Demo Player',public_id:'P000001',online:true}));
 let demoStep=1,claimed=false;
 window.RPG_V66={ready:Promise.resolve(true),call:async(path,body)=>{
  if(path==='/api/tutorial/state')return {ok:true,version:0,step:demoStep,complete:false,tutorialClaimed:claimed};
  if(path==='/api/tutorial/progress'){demoStep=body.step;return {ok:true,step:demoStep,complete:demoStep===5};}
  if(path==='/api/recruitment/pull'){if(claimed)throw Error('This free 10-pull was already used.');claimed=true;const d=await fetch('gacha_catalog.json').then(r=>r.json());const roster=d.characters;return {ok:true,results:[0,1,8,2,3,4,5,6,7,9].map(i=>({...roster[i],duplicate:false,shards:0}))};}
  throw Error('Unavailable in offline demo');
 }};
</script>
