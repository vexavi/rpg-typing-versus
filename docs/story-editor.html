<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conquest Editor — RPG Typing Versus</title>
<link rel="stylesheet" href="teacher-nav.css?v=148.9"><script defer src="teacher-nav.js?v=148.8"></script>
<link rel="stylesheet" href="story-editor.css?v=148.9">
<script defer src="game-mechanics.js?v=147.0"></script><script defer src="custom-mechanics.js?v=143.0"></script>
</head><body><main>
<header class="header"><div><h1>Conquest Editor</h1></div><div class="actions"><button id="google" type="button">Sign in with Google</button><button id="signout" type="button" hidden>Sign out</button></div></header>
<div class="toolbar panel cq-sticky"><div class="cq-tool-left"><button id="saveDraft" type="button" title="Keep your work in this browser without publishing">Save Draft</button><button id="reload" type="button" title="Throw away unpublished changes and load what students see">Reload Published</button><button id="export" type="button">Export JSON</button><label class="filebutton" for="import">Import JSON<input id="import" type="file" accept="application/json,.json" hidden></label></div><p id="status" role="status" aria-live="polite">Loading territories…</p><button id="publish" class="primary" type="button" title="Make these changes live for students">Publish</button></div>
<div class="cq-tabs"><button type="button" id="cq-encounters-tab" data-editor-tab="encounters" aria-pressed="true">Territories &amp; Encounters</button><button type="button" data-editor-tab="enhancements">Enhancements</button><button type="button" data-editor-tab="banners">Banners</button><button type="button" id="cq-operators-tab" data-editor-tab="operators">Operator Stats</button><button type="button" data-editor-tab="assets">Assets</button></div>
<div class="layout">
 <aside class="panel sidebar"><div class="sectionhead"><h2>Territories</h2><button id="addChapter" type="button" hidden>+ Territory</button></div><div id="chapterList" class="navlist"></div></aside>
 <section class="panel editpanel"><div id="chapterFields"></div><div class="sectionhead cq-encounter-heading"><h2>Encounters</h2><button id="addStage" type="button">+ Encounter</button></div><div id="stageList" class="navlist cq-encounter-nav"></div><div id="stageFields"></div><div id="slidesEditor" hidden></div></section>
</div>
<section class="panel" id="operatorFields" hidden></section>
<section class="panel photo-manager"><details><summary><strong>Battle Assets</strong> · Sprites, backgrounds & music</summary><div class="editheading cq-asset-head"><h2>GitHub assets</h2><button id="downloadPhotos" type="button" disabled>Download Photo Pack (0)</button><button id="downloadAudio" type="button" disabled>Download Music Pack (0)</button></div>
<div class="photo-manager-row"><div class="field"><label for="repoName">GitHub repository</label><input id="repoName" placeholder="username/repository" autocomplete="off" spellcheck="false"></div><button id="repairGithub" type="button">Find Existing Images</button><button id="checkPhotos" type="button">Check Images</button><button id="findMusic" type="button">Find Existing Music</button><button id="checkMusic" type="button">Check Music</button></div>
<div class="photo-manager-row"><button id="shortenNames" type="button">Make Short-Name ZIP</button><label class="filebutton" for="repairFolder">Choose Local Images Folder<input id="repairFolder" type="file" webkitdirectory directory multiple hidden></label></div>
<p class="muted">New files: download packs → extract into repository → push → publish.</p>
<div id="photoReportPanel" hidden><h3>Image Report</h3><ul id="photoReport" class="photo-report"></ul></div><div id="musicReportPanel" hidden><h3>Music Report</h3><ul id="musicReport" class="photo-report"></ul></div></details></section>
</main><script>
window.RPG_STORY_EDITOR_BOOT={loaded:false};
// A classic-script loader can report a module import failure rather than leaving
// the page permanently stuck on "Loading territories".
import('./story-editor.js?v=141.0').catch(error=>{
 const notice=document.getElementById('status');
 notice.className='error';
 notice.textContent='Conquest Editor script failed to start: '+String(error?.message||error).slice(0,240)+'. Check the uploaded docs/ files and refresh.';
 console.error('Conquest Editor startup:',error);
});
setTimeout(()=>{
 const state=window.RPG_STORY_EDITOR_BOOT,notice=document.getElementById('status');
 if(state&&!state.loaded&&notice&&/Loading territories/i.test(notice.textContent)){
  notice.className='error';
  notice.textContent='Conquest Editor could not load local chapters. Verify docs/story/chapters.json and reload.';
 }
},7000);
</script></body></html>
