<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adventure Game Settings — Teacher</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}main{max-width:1030px;margin:0 auto;padding:24px 18px 50px}header{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:18px}h1{font-size:25px;margin:0}h2{font-size:17px;margin:0 0 14px}.panel{background:#fff;border:1px solid #dde4ef;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 2px 6px #182b4c0a}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:13px;font-weight:700;color:#4b5563}input,select,button{font:inherit;border:1px solid #cbd5e1;border-radius:7px;min-height:40px;padding:8px 11px;background:#fff;color:#172033}input:focus,select:focus,button:focus-visible{outline:2px solid #2563eb}button{cursor:pointer;font-weight:700}button.primary{color:white;background:#235cd1;border-color:#235cd1}button.danger{color:#a02626;background:#fff4f4;border-color:#f0c3c3}button:disabled{opacity:.55;cursor:not-allowed}a{color:#2257bc;text-decoration:none}.muted{color:#667085;font-size:13px}.mechanic{border:1px solid #e0e6ef;border-radius:9px;padding:14px;margin-top:10px}.mechanic h3{margin:0;font-size:15px}.mechanic .grid{margin-top:12px}.hidden{display:none!important}#status{min-height:22px;font-weight:650;font-size:13px}#status.bad{color:#b42318}#status.good{color:#137547}.topline{font-size:12px;font-weight:750;letter-spacing:.08em;color:#657084;text-transform:uppercase;margin:0 0 8px}.toolbar{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}.tip{font-size:12px;color:#64748b;margin:5px 0 0}
input.is-custom{border-color:#2457d6;background:#f2f6ff;font-weight:700}
</style>
<link rel="stylesheet" href="teacher-nav.css?v=148.9"><script defer src="teacher-nav.js?v=148.8"></script>
</head><body><main>
<header><div><h1>Difficulty</h1></div><div class="row"><button id="google">Sign in with Google</button><button id="signout" class="hidden">Sign out</button></div></header>
<div class="panel"><div class="grid"><div class="field"><label for="mode">Mode</label><select id="mode"><option value="normal">Normal</option><option value="practice">Practice</option></select></div><div class="field"><label for="scope">Apply to</label><select id="scope"><option value="mode">All stages</option><option value="chapter" hidden disabled>Chapter defaults</option><option value="stage">One stage only</option></select></div><div class="field" id="chapter-row"><label for="chapter">Chapter</label><select id="chapter"></select></div><div class="field" id="stage-row"><label for="stage">Stage</label><select id="stage"></select></div></div></div>
<div class="panel"><h2>Difficulty</h2><div id="difficulty" class="grid"></div><p class="tip">Grey numbers are what the game uses now. Type a number to change it, leave a box empty to keep the grey value, then press <b>Publish</b>. Changes apply from the student’s next run.</p></div>
<div class="panel" id="mechanics-panel"><h2>Word Mechanics</h2><div id="mechanics"></div></div>
<div class="panel"><div class="toolbar"><button id="reload-settings">Reload</button><button id="reset" class="danger">Reset to built-in</button><button id="save" class="primary">Publish</button></div><p id="status" role="status" aria-live="polite"></p></div>

<script src="game-mechanics.js?v=147.0"></script><script src="custom-mechanics.js?v=143.0"></script><script type="module" src="game-settings.js?v=148.9"></script>
</main></body></html>
