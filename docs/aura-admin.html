</head><body><main><h1>Character Shards</h1><p>Tip: the <a href="teacher-dashboard.html" style="display:inline;padding:0;margin:0;background:none;color:#ffd45b;text-decoration:underline">Teacher Dashboard</a> can give shards from each student's Manage panel.</p><div id="identity">Not signed in</div><button id="login">TEACHER GOOGLE SIGN IN</button><form id="grant"><label>PLAYER ID (not the private card code)<input id="playerId" placeholder="P000001" required pattern="P[0-9]{6,}"></label><label>SHARD TYPE<select id="rarity" style="display:block;background:#101019;color:#fff;padding:12px;width:100%;margin-top:7px;border:1px solid #888"><option value="4">4★ shards (4★ operator auras)</option><option value="5">5★ shards (5★ operator auras)</option><option value="6">6★ shards (6★ operator auras)</option></select></label><label>SHARDS TO ADD (1–1,000)<input id="amount" type="number" min="1" max="1000" value="10" required></label><small>Gold on one operator costs 45 4★ shards, 8 5★ shards or 5 6★ shards in total.</small><button id="add" type="submit" disabled>Grant Shards</button></form><div id="status" role="status"></div></main><script>const id=new URLSearchParams(location.search).get("player");if(/^P[0-9]{6,}$/.test(id||""))document.getElementById("playerId").value=id;</script><script type="module" src="aura-admin.js?v=148.8"></script></body></html>
